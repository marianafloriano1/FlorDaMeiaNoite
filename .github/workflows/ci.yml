            printf 'TASK006_TEST_SUPABASE_ANON_KEY=%s\n' "$anon_key"
            printf 'TASK006_TEST_SUPABASE_SERVICE_ROLE_KEY=%s\n' "$service_role_key"
            printf 'TASK007_TEST_SUPABASE_URL=%s\n' "$api_url"
            printf 'TASK007_TEST_SUPABASE_ANON_KEY=%s\n' "$anon_key"
            printf 'TASK007_TEST_SUPABASE_SERVICE_ROLE_KEY=%s\n' "$service_role_key"
            printf 'TASK007_REQUIRE_SUPABASE=1\n'
            printf 'TASK009_TEST_SUPABASE_URL=%s\n' "$api_url"
            printf 'TASK009_TEST_SUPABASE_ANON_KEY=%s\n' "$anon_key"
            printf 'TASK009_TEST_SUPABASE_SERVICE_ROLE_KEY=%s\n' "$service_role_key"
            printf 'NEXT_PUBLIC_SUPABASE_URL=%s\n' "$api_url"
            printf 'NEXT_PUBLIC_SUPABASE_ANON_KEY=%s\n' "$anon_key"
            printf 'SUPABASE_SERVICE_ROLE_KEY=%s\n' "$service_role_key"
          } >> "$GITHUB_ENV"

      - name: Regressão unitária das tarefas anteriores
        run: |
          npm run test:auth
          npm run test:catalog
          npm run test:task005
          npm run test:task006
          npm run test:task007
          npm run test:task009
          npm run test:auth:supabase-mfa
          npm run test:task009:integration

      - name: Testes unitários TASK-010 sem skips
        run: npm run test:task010

      - name: Teste integrado TASK-010 (TAP, zero skips)
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/task010-integration.log"
          set +e
          node --import=tsx --test --test-reporter=tap tests/task010/notifications.integration.test.ts 2>&1 | tee "$log"
          result=${PIPESTATUS[0]}
          set -e
          test "$result" -eq 0
          grep -Eq '^# tests 1$' "$log"
          grep -Eq '^# pass 1$' "$log"
          grep -Eq '^# fail 0$' "$log"
          if grep -Eq '^# skipped [1-9][0-9]*$|^# SKIP' "$log"; then
            echo 'TASK-010 Supabase integration must not be skipped.' >&2
            exit 1
          fi
          grep -Fq 'ok 1 - TASK-010: outbox transacional, RLS, reagendamento e corrida de cancelamento' "$log"

      - name: Lint direcionado TASK-010
        run: npm run lint:task010

      - name: Verificar tipos
        run: npm run typecheck

      - name: Smoke test do worker OCI com canal desabilitado
        shell: bash
        run: |
          set -euo pipefail
          container="task010-worker-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() { docker rm -f "$container" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          worker_url="${TASK010_TEST_SUPABASE_URL/http:\/\/127.0.0.1/http:\/\/host.docker.internal}"
          docker run --detach --name "$container" --add-host host.docker.internal:host-gateway \
            --env "NEXT_PUBLIC_SUPABASE_URL=$worker_url" \
            --env "SUPABASE_SERVICE_ROLE_KEY=$TASK010_TEST_SUPABASE_SERVICE_ROLE_KEY" \
            --env NOTIFICATION_WORKER_POLL_INTERVAL_MS=1000 \
            "flor-da-meia-noite-task010-worker:${GITHUB_SHA}"
          sleep 3
          running="$(docker inspect --format '{{.State.Running}}' "$container")"
          if [ "$running" != "true" ]; then
            docker logs --tail 80 "$container" || true
            echo 'TASK-010 worker container exited before completing its idle cycle.' >&2
            exit 1
          fi
          if docker logs "$container" 2>&1 | grep -q 'transactional_notification_cycle_failed'; then
            docker logs --tail 80 "$container" || true
            exit 1
          fi

      - name: Encerrar stack Supabase efêmera TASK-010
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${TASK010_SUPABASE_WORKDIR:-}" ]]; then
            supabase stop --workdir "$TASK010_SUPABASE_WORKDIR" --no-backup
          else
            echo "Stack Supabase TASK-010 não foi preparada; nada a encerrar."
          fi
