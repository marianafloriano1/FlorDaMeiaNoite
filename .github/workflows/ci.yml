name: CI

on:
  push:
    branches:
      - master
      - "task/**"
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, typecheck, build e imagem OCI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Obter código
        uses: actions/checkout@v7.0.1

      - name: Configurar Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.1

      - name: Instalar dependências do lockfile
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Verificar tipos
        run: npm run typecheck

      - name: Build da aplicação
        run: npm run build

      - name: Construir imagem do container
        run: docker build --pull --tag flor-da-meia-noite:${{ github.sha }} .

  task005-integration:
    name: TASK-005 Supabase integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Obter código
        uses: actions/checkout@v7.0.1

      - name: Configurar Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.1
          cache: npm

      - name: Instalar dependências do lockfile
        run: npm ci --no-audit --no-fund

      - name: Instalar Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.122.0

      - name: Preparar projeto Supabase efêmero
        shell: bash
        run: |
          set -euo pipefail
          workdir="$RUNNER_TEMP/task005-supabase"
          mkdir -p "$workdir"
          cp -R supabase "$workdir/supabase"
          project_id="task005-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sed -i -E "s/^project_id = .*/project_id = \"$project_id\"/" "$workdir/supabase/config.toml"
          echo "TASK005_SUPABASE_WORKDIR=$workdir" >> "$GITHUB_ENV"

      - name: Iniciar stack e aplicar migrations pendentes
        run: |
          set -euo pipefail
          supabase start --workdir "$TASK005_SUPABASE_WORKDIR"
          supabase migration up --local --workdir "$TASK005_SUPABASE_WORKDIR"

      - name: Exportar URL e chaves da stack local
        shell: bash
        run: |
          set -euo pipefail
          status="$(supabase status --workdir "$TASK005_SUPABASE_WORKDIR" -o env)"
          value() { printf '%s\n' "$status" | sed -n "s/^$1=//p" | head -n 1 | tr -d '\"'; }
          api_url="$(value API_URL)"
          anon_key="$(value ANON_KEY)"
          service_role_key="$(value SERVICE_ROLE_KEY)"
          test -n "$api_url" && test -n "$anon_key" && test -n "$service_role_key"
          [[ "$api_url" == http://127.0.0.1:* || "$api_url" == http://localhost:* ]]
          echo "::add-mask::$anon_key"
          echo "::add-mask::$service_role_key"
          {
            printf 'TASK005_TEST_SUPABASE_URL=%s\n' "$api_url"
            printf 'TASK005_TEST_SUPABASE_ANON_KEY=%s\n' "$anon_key"
            printf 'TASK005_TEST_SUPABASE_SERVICE_ROLE_KEY=%s\n' "$service_role_key"
          } >> "$GITHUB_ENV"

      - name: Validar variáveis obrigatórias
        shell: bash
        run: |
          set -euo pipefail
          : "${TASK005_TEST_SUPABASE_URL:?URL local ausente}"
          : "${TASK005_TEST_SUPABASE_ANON_KEY:?chave anon ausente}"
          : "${TASK005_TEST_SUPABASE_SERVICE_ROLE_KEY:?chave service role ausente}"

      - name: Testes integrados TASK-005 (skip proibido)
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/task005-test.log"
          set +e
          node --import=tsx --test --test-reporter=tap tests/task005/*.test.ts 2>&1 | tee "$log"
          result=${PIPESTATUS[0]}
          set -e
          test "$result" -eq 0
          if grep -Eq '^# skipped [1-9][0-9]*$|# SKIP' "$log"; then
            echo 'TASK-005 integration tests must not be skipped.' >&2
            exit 1
          fi
          grep -Eq '^ok [0-9]+ - TASK-005: Supabase isolado valida RLS, atomicidade, rollback e idempotência$' "$log"
          for expected in \
            'última unidade: exatamente uma reserva concorrente vence' \
            'uma reserva ativa por cliente e cancelamento repetido não liberam duas vezes' \
            'expiração repetida muda o estado e devolve saldo uma única vez' \
            'falha em um item reverte toda a reserva e o estoque' \
            'anon não pode criar carrinho'
          do
            grep -Fq "# Subtest: $expected" "$log" || {
              echo "Missing TASK-005 integration scenario: $expected" >&2
              exit 1
            }
          done

      - name: Lint direcionado TASK-005
        run: >-
          npx biome check src/app/cart/page.tsx src/app/api/cart/route.ts
          src/app/api/cart/items/route.ts src/app/api/favorites/route.ts
          src/app/api/reservations/route.ts 'src/app/api/reservations/[id]/route.ts'
          src/lib/cart/service.ts src/lib/cart/validation.ts
          src/workers/reservation-expiration.mjs

      - name: Verificar tipos
        run: npm run typecheck
