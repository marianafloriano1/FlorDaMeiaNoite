name: CI

on:
  push:
    branches:
      - master
      - "task/**"
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, typecheck, build e imagem OCI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Obter código
        uses: actions/checkout@v7.0.1

      - name: Configurar Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.1

      - name: Instalar dependências do lockfile
        run: npm ci --no-audit --no-fund


      - name: Lint direcionado TASK-007
        if: startsWith(github.ref, 'refs/heads/task/TASK-007') || startsWith(github.head_ref, 'task/TASK-007')
        run: npm run lint:task007

      - name: Lint direcionado TASK-009
        if: startsWith(github.ref, 'refs/heads/task/TASK-009') || startsWith(github.head_ref, 'task/TASK-009')
        run: npm run lint:task009

      - name: Lint direcionado TASK-010
        if: startsWith(github.ref, 'refs/heads/task/TASK-010') || startsWith(github.head_ref, 'task/TASK-010')
        run: npm run lint:task010

      - name: Lint global
        if: ${{ !startsWith(github.ref, 'refs/heads/task/TASK-007') && !startsWith(github.head_ref, 'task/TASK-007') && !startsWith(github.ref, 'refs/heads/task/TASK-009') && !startsWith(github.head_ref, 'task/TASK-009') && !startsWith(github.ref, 'refs/heads/task/TASK-010') && !startsWith(github.head_ref, 'task/TASK-010') }}
        run: npm run lint

      - name: Verificar tipos
        run: npm run typecheck

      - name: Build da aplicação
        run: npm run build

      - name: Construir imagem do container TASK-007
        if: startsWith(github.ref, 'refs/heads/task/TASK-007') || startsWith(github.head_ref, 'task/TASK-007')
        run: docker build --pull --build-arg TASK007_LINT_SCOPE=1 --tag flor-da-meia-noite:${{ github.sha }} .

      - name: Construir imagem do container TASK-009
        if: startsWith(github.ref, 'refs/heads/task/TASK-009') || startsWith(github.head_ref, 'task/TASK-009')
        run: docker build --pull --build-arg TASK009_LINT_SCOPE=1 --tag flor-da-meia-noite:${{ github.sha }} .

      - name: Construir imagem da aplicação TASK-010
        if: startsWith(github.ref, 'refs/heads/task/TASK-010') || startsWith(github.head_ref, 'task/TASK-010')
        run: docker build --pull --build-arg TASK010_LINT_SCOPE=1 --tag flor-da-meia-noite:${{ github.sha }} .

      - name: Construir imagem do worker TASK-010
        if: startsWith(github.ref, 'refs/heads/task/TASK-010') || startsWith(github.head_ref, 'task/TASK-010')
        run: docker build --pull --build-arg TASK010_LINT_SCOPE=1 --target task010-notification-worker --tag flor-da-meia-noite-task010-worker:${{ github.sha }} .

      - name: Iniciar container e verificar endpoint TASK-009
        if: startsWith(github.ref, 'refs/heads/task/TASK-009') || startsWith(github.head_ref, 'task/TASK-009')
        shell: bash
        run: |
          set -euo pipefail
          container="task009-oci-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker rm -f "$container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --detach \
            --name "$container" \
            --publish 127.0.0.1:3000:3000 \
            "flor-da-meia-noite:${GITHUB_SHA}"

          for attempt in {1..30}; do
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --connect-timeout 2 --max-time 5 \
              http://127.0.0.1:3000/auth 2>/dev/null || true)"
            if [ "$status" = "200" ]; then
              echo "OCI smoke test: GET /auth returned HTTP 200."
              exit 0
            fi
            sleep 2
          done

          docker logs --tail 80 "$container" || true
          echo "::error::OCI container did not serve GET /auth with HTTP 200."
          exit 1

      - name: Construir imagem do container
        if: ${{ !startsWith(github.ref, 'refs/heads/task/TASK-007') && !startsWith(github.head_ref, 'task/TASK-007') && !startsWith(github.ref, 'refs/heads/task/TASK-009') && !startsWith(github.head_ref, 'task/TASK-009') && !startsWith(github.ref, 'refs/heads/task/TASK-010') && !startsWith(github.head_ref, 'task/TASK-010') }}
        run: docker build --pull --tag flor-da-meia-noite:${{ github.sha }} .

  task006-integration:
    name: TASK-006 Supabase integration
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Obter código
        uses: actions/checkout@v7.0.1

      - name: Configurar Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.1
          cache: npm

      - name: Instalar dependências do lockfile
        run: npm ci --no-audit --no-fund

      - name: Instalar Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.122.0

      - name: Preparar projeto Supabase efêmero
        shell: bash
        run: |
          set -euo pipefail
          workdir="$RUNNER_TEMP/task006-supabase"
          mkdir -p "$workdir"
          cp -R supabase "$workdir/supabase"
          project_id="task006-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sed -i -E "s/^project_id = .*/project_id = \"$project_id\"/" "$workdir/supabase/config.toml"

          echo "TASK006_SUPABASE_WORKDIR=$workdir" >> "$GITHUB_ENV"

      - name: Iniciar stack efêmera e aplicar migrations
        run: |
          set -euo pipefail
          supabase start --workdir "$TASK006_SUPABASE_WORKDIR"
          supabase migration up --local --workdir "$TASK006_SUPABASE_WORKDIR"

      - name: Exportar URL e chaves reais da stack local
        shell: bash
        run: |
          set -euo pipefail
          status="$(supabase status --workdir "$TASK006_SUPABASE_WORKDIR" -o env)"
          value() { printf '%s\n' "$status" | sed -n "s/^$1=//p" | head -n 1 | tr -d '\"'; }
          api_url="$(value API_URL)"
          anon_key="$(value ANON_KEY)"
          service_role_key="$(value SERVICE_ROLE_KEY)"
          test -n "$api_url" && test -n "$anon_key" && test -n "$service_role_key"
          [[ "$api_url" == http://127.0.0.1:* || "$api_url" == http://localhost:* ]]
          echo "::add-mask::$anon_key"
          echo "::add-mask::$service_role_key"
          {
            printf 'TASK006_TEST_SUPABASE_URL=%s\n' "$api_url"
            printf 'TASK006_TEST_SUPABASE_ANON_KEY=%s\n' "$anon_key"
            printf 'TASK006_TEST_SUPABASE_SERVICE_ROLE_KEY=%s\n' "$service_role_key"
            printf 'WHATSAPP_STORE_NUMBER=+15555550199\n'
            printf 'ORDER_CANCELLATION_POLICY_TEXT=Política sintética de teste: consulte a loja antes do pagamento.\n'
          } >> "$GITHUB_ENV"

      - name: Confirmar variáveis obrigatórias
        shell: bash
        run: |
          set -euo pipefail
          : "${TASK006_TEST_SUPABASE_URL:?URL local ausente}"
          : "${TASK006_TEST_SUPABASE_ANON_KEY:?chave anon ausente}"
          : "${TASK006_TEST_SUPABASE_SERVICE_ROLE_KEY:?chave service role ausente}"
          : "${WHATSAPP_STORE_NUMBER:?número sintético ausente}"
          : "${ORDER_CANCELLATION_POLICY_TEXT:?texto sintético ausente}"

      - name: Testes integrados TASK-006 (skip proibido)
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/task006-test.log"
          set +e
          node --import=tsx --test --test-reporter=tap tests/task006/*.test.ts 2>&1 | tee "$log"
          result=${PIPESTATUS[0]}
          set -e
          test "$result" -eq 0
          if grep -Eq '^# skipped [1-9][0-9]*$|# SKIP' "$log"; then
            echo 'TASK-006 integration tests must not be skipped.' >&2
            exit 1
          fi
          grep -Eq '^ok [0-9]+ - TASK-006: Supabase isolado valida cotação, consentimento, pedido, papéis e expiração$' "$log"
          for expected in \
            'preço mudou desde a seleção: diferença indicada e consentimento explícito cria snapshot atualizado' \
            'retry concorrente com a mesma idempotency key devolve o mesmo pedido' \
            'preço alterado após a cotação aborta o commit sem consumir reserva nem cotação' \
            'inspeção, step-up do admin e pagamento concluem reserva sem devolver estoque' \
            'expiração libera estoque uma vez e cancela irrevogavelmente pedido não pago' \
            'conversão concorrente com expiração produz apenas um resultado consistente'
          do
            grep -Fq "# Subtest: $expected" "$log" || {
              echo "Missing TASK-006 integration scenario: $expected" >&2
              exit 1
            }
          done

      - name: Lint direcionado TASK-006
        run: >-
          npx biome check src/app/cart/page.tsx src/app/orders/'[reference]'/page.tsx
          src/app/admin/orders/page.tsx src/app/api/orders/route.ts
          src/app/api/orders/quote/route.ts src/app/api/orders/'[reference]'/route.ts
          src/app/api/admin/orders/route.ts src/app/api/admin/orders/'[id]'/route.ts
          src/lib/orders tests/task006

      - name: Verificar tipos
        run: npm run typecheck

      - name: Build Next.js
        run: npm run build

      - name: Construir imagem OCI
        run: docker build --pull --tag flor-da-meia-noite-task006:${{ github.sha }} .

